[pytest]
# Only the pytest suite. The plain scripts in src/tests run at import time,
# so pytest must not collect them directly (tests/test_scripts.py runs them).
testpaths = tests
addopts = -ra
filterwarnings =
    # SQLAlchemy column defaults use datetime.utcnow (Python 3.12+ warns)
    ignore:datetime.datetime.utcnow:DeprecationWarning
